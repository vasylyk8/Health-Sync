# Runs on pull requests and on pushes to main (not on every push to a branch that already has a PR, which
# used to run everything twice). deploy.yml calls it as a gate, so a deploy never ships untested code.
name: server-ci
on:
  push:
    branches: [main]
    paths: ['firebase/**', 'web/**', 'shared/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['firebase/**', 'web/**', 'shared/**', '.github/workflows/server-ci.yml']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same PR supersedes the older run. Pushes to main and calls from deploy.yml get a unique
# group, so they are never cancelled.
concurrency:
  group: server-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage floors
        run: npm run test:coverage
      - name: Integration tests (Firebase emulators)
        run: npm run test:emulator
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser consent and Firebase Auth tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: firebase/functions/test-results
