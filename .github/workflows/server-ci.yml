name: server-ci
on:
  push:
    paths: ['firebase/**', 'web/**', 'shared/**', '.github/workflows/server-ci.yml']
  pull_request:
    paths: ['firebase/**', 'web/**', 'shared/**', '.github/workflows/server-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Integration tests (Firebase emulators)
        run: npm run test:emulator
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser consent and Firebase Auth tests
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: firebase/functions/test-results
