# Deploys the server. Runs on main and the named development branch only: other feature branches share this backend with TestFlight testers and must not deploy.
# Skips cleanly (with a notice) until the Google Cloud secrets from docs/SETUP.md exist.
# Server tests (server-ci) must pass first. For an emergency, dispatch by hand with skip_ci ticked.
name: deploy
on:
  push:
    branches: [main, claude/youthful-planck-k7ff0m]
    paths: ['firebase/**', 'shared/**', 'scripts/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      skip_ci:
        description: Deploy without running the server tests first (emergencies only)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/server-ci.yml
  deploy:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_GCP: ${{ secrets.GCP_WIF_PROVIDER != '' }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SA }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    steps:
      - if: env.HAS_GCP != 'true'
        run: echo "::notice::Google Cloud secrets not set yet (docs/SETUP.md). Skipping deploy."
      - if: env.HAS_GCP == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - if: env.HAS_GCP == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta,alpha
      - if: env.HAS_GCP == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.HAS_GCP == 'true'
        run: scripts/tasks/deploy.sh
