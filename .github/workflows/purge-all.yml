# Owner tool: removes every account and all stored data from the server. IRREVERSIBLE in "run" mode.
# A push to ops/purge-all only prints the plan (read-only). "run" needs a manual dispatch with the confirmation text.
name: purge-all
on:
  push:
    branches: [ops/purge-all]
    paths: ['.github/workflows/purge-all.yml', 'scripts/tasks/purge-all.sh', 'firebase/functions/scripts/purge-all.ts']
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan (read-only) or run (deletes everything)'
        type: choice
        options: [plan, run]
        default: plan
      confirm:
        description: 'For run: type DELETE EVERYTHING'
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: purge-all
  cancel-in-progress: false
jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'plan' }}
      CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || '' }}
    steps:
      - run: |
          if [[ "$MODE" == "run" && "$CONFIRM" != "DELETE EVERYTHING" ]]; then
            echo "::error::run needs the confirmation text DELETE EVERYTHING"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/tasks/purge-all.sh "$MODE"
