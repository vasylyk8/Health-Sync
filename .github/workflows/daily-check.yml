# End-to-end check of the app's daily-metrics pass against the iOS simulator's real HealthKit: writes a few days of readings,
# reads them back through the app's own code and fails if a metric that has data does not come out. The upload batches the
# app builds from them are then ingested by the real server code and queried through the MCP endpoint (job `server`).
name: daily-check
on:
  push:
    branches: [main, 'ops/phone-to-server-check', 'fix/daily-release-build', 'fix/daily-result-retention', 'claude/relaxed-volta-g9ip9f', 'fix/health-completeness-regressions', 'perf/shared-reads-release', 'perf/history-scheduling']
    paths: ['.github/workflows/daily-check.yml', 'ios/HealthSync/Health/**', 'ios/HealthSync/Sync/**', 'firebase/functions/src/ingest/**', 'ios/HealthSyncUITests/DailyCheckUITests.swift', 'firebase/functions/test/unit/phone-batches.test.ts', 'firebase/functions/test/helpers/synthetic.ts']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Debug and the optimized Release build the phone runs: they can behave differently.
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    env:
      BUNDLE_ID: app.healthsync.dev
      APPLE_TEAM_ID: ''
      PUBLIC_BASE_URL: https://krok-1d60a.web.app
      SIM_DEVICE: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Daily check
        run: |
          run_check() {
            xcodebuild test -project HealthSync.xcodeproj -scheme HealthSync \
              -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
              -only-testing:HealthSyncUITests/DailyCheckUITests \
              -configuration ${{ matrix.config }} ENABLE_TESTABILITY=YES SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) DEBUG' \
              -resultBundlePath "daily-$1.xcresult" \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= 2>&1 | tee daily.log | grep -E "DAILYLOG|DAILYUI|error:|Test Case|\*\* TEST"
            return ${PIPESTATUS[0]}
          }
          run_check 1 && exit 0
          # The simulator sometimes lets the HealthKit permission sheet time out before the test can tap it: that says nothing
          # about the app, so retry once. Any other failure (a missing metric, a crash) fails the run.
          if grep -q "Authorization session timed out" daily.log; then
            echo "::warning::HealthKit permission sheet timed out on the simulator; retrying once"
            run_check 2
          else
            exit 1
          fi
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-check-log-${{ matrix.config }}
          path: ios/daily.log
      - name: Collect the upload batches the app built
        run: |
          mkdir -p batches
          python3 - <<'PY'
          import base64, collections, re
          pieces = collections.defaultdict(dict)
          for line in open('daily.log', errors='replace'):
              m = re.search(r'DAILYBATCH (\S+) (\d+) (\S+)', line)
              if m: pieces[m.group(1)][int(m.group(2))] = m.group(3)
          for bid, parts in pieces.items():
              data = ''.join(parts[i] for i in sorted(parts))
              open(f'batches/{bid}.ndjson.gz', 'wb').write(base64.b64decode(data))
          print(f'{len(pieces)} batches collected')
          PY
          ls -la batches
      - uses: actions/upload-artifact@v4
        with:
          name: phone-batches-${{ matrix.config }}
          path: ios/batches
          if-no-files-found: error
  server:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phone-batches-${{ matrix.config }}
          path: phone-batches
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
        working-directory: firebase/functions
      - name: Ingest the app's batches and ask questions through the MCP endpoint
        working-directory: firebase/functions
        env:
          PHONE_BATCH_DIR: ${{ github.workspace }}/phone-batches
        run: |
          node scripts/copy-shared.mjs
          ls "$PHONE_BATCH_DIR"
          npx vitest run test/unit/phone-batches.test.ts
