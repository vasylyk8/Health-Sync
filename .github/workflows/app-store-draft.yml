name: App Store listing draft
on:
  push:
    branches: [codex/app-store-draft-20261004]
    paths:
      - scratch-app-store/**
      - .github/workflows/app-store-draft.yml
permissions:
  contents: read
concurrency:
  group: krok-app-store-listing-draft
  cancel-in-progress: false
jobs:
  save-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save and verify public listing draft
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python scratch-app-store/save-draft.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-draft-readback
          path: draft-result/*.json
          if-no-files-found: ignore
          retention-days: 14
