name: reviewer-provision
on:
  push:
    branches: [codex/public-listing-prep]
    paths: ['.github/workflows/reviewer-provision.yml', 'firebase/functions/scripts/*reviewer*.mjs', 'scripts/tasks/provision-directory-reviewer.py']
  workflow_dispatch:
    inputs:
      enable_password_provider:
        description: 'Apply the project-wide provider change only after explicit owner approval'
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: krok-directory-reviewer
  cancel-in-progress: false
jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
        working-directory: firebase/functions
      - run: npm run build
        working-directory: firebase/functions
      - run: npx playwright install --with-deps chromium
        working-directory: firebase/functions
      - name: Apply explicitly owner-approved password provider change
        if: (github.event_name == 'workflow_dispatch' && inputs.enable_password_provider) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[approved-reviewer-provider]'))
        run: python3 scripts/tasks/enable-reviewer-password-provider.py --apply
      - name: Validate synthetic production dataset and reviewer access without exposing credentials
        run: python3 scripts/tasks/provision-directory-reviewer.py --apply
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-reviewer-verification-no-credentials
          path: |
            /tmp/krok-reviewer-verification.json
            /tmp/krok-reviewer-dataset-verification.json
