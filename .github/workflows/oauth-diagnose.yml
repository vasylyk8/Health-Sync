# Read-only diagnosis of ChatGPT connector disconnects. Prints only non-identifying metadata
# (no uids, tokens, IPs or URL paths beyond the first segment) because job logs of a public repo are public.
name: oauth-diagnose
on:
  push:
    branches: [claude/wizardly-ritchie-b9pqqq]
    paths: ['.github/workflows/oauth-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Granted scopes per grant (metadata only)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, urllib.error, datetime, collections
          P = os.environ['GCP_PROJECT_ID']
          tok = subprocess.check_output(['gcloud', 'auth', 'print-access-token']).decode().strip()
          base = f'https://firestore.googleapis.com/v1/projects/{P}/databases/(default)/documents'
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json', 'x-goog-user-project': P})
              try: return json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as e: return {'_error': e.code, '_body': e.read().decode()[:300]}
          def val(v):
              for k in ('stringValue', 'doubleValue', 'booleanValue', 'timestampValue'):
                  if k in v: return v[k]
              if 'integerValue' in v: return int(v['integerValue'])
              if 'mapValue' in v: return {k: val(x) for k, x in v['mapValue'].get('fields', {}).items()}
              if 'arrayValue' in v: return [val(x) for x in v['arrayValue'].get('values', [])]
              return None
          def doc(d): return {k: val(v) for k, v in d.get('fields', {}).items()}
          r = call(base + ':runQuery', {'structuredQuery': {'from': [{'collectionId': 'oauthGrants', 'allDescendants': True}], 'limit': 200}})
          grants = [doc(x['document']) for x in r if 'document' in x] if isinstance(r, list) else []
          grants.sort(key=lambda g: -g.get('expires', 0))
          iso = lambda ms: datetime.datetime.fromtimestamp(ms / 1000, datetime.timezone.utc).strftime('%Y-%m-%d %H:%MZ')
          print(f'{len(grants)} grant(s)')
          for g in grants[:10]:
              print(f'provider={g.get("provider")} connected~{iso(g["expires"] - 30 * 86_400_000)} revoked={g.get("revoked")} hasOfflineAccess={"offline_access" in (g.get("scopes") or [])} scopes={g.get("scopes")}')
          PY
      - name: Requested scopes on /authorize (scope and resource params only)
        continue-on-error: true
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND logName:"run.googleapis.com%2Frequests" AND resource.labels.service_name="authorization" AND httpRequest.requestUrl:"/authorize"' \
            --project "$GCP_PROJECT_ID" --freshness=48h --limit=50 --format=json > /tmp/authorize.json
          python3 - <<'PY'
          import json, urllib.parse
          for r in sorted(json.load(open('/tmp/authorize.json')), key=lambda r: r['timestamp']):
              q = urllib.parse.parse_qs(urllib.parse.urlparse(r['httpRequest']['requestUrl']).query)
              print(r['timestamp'][:19], 'scope=', q.get('scope'), 'resource=', q.get('resource'))
          PY
