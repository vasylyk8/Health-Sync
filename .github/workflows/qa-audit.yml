name: qa-audit
on:
  push:
    branches: ['codex/qa-audit-20260929']
    paths: ['.github/workflows/qa-audit.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - name: Unit and diagnostic regressions
        continue-on-error: true
        run: npm test > qa-unit.log 2>&1
      - name: Isolated emulators
        continue-on-error: true
        run: npm run test:emulator > qa-emulator.log 2>&1
      - name: Local synthetic benchmark
        continue-on-error: true
        run: HS_LOG=off npx tsx bench/bench.ts > qa-benchmark.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-backend-evidence
          path: firebase/functions/qa-*.log
  simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      BUNDLE_ID: app.healthsync.dev
      APPLE_TEAM_ID: ''
      PUBLIC_BASE_URL: https://krok-1d60a.web.app
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          cd ios
          xcodegen generate --spec project.yml
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY'
          import json,os
          devices=json.load(open('devices.json'))['devices']
          candidates=next([x for x in devices[k] if x['name'].startswith('iPhone')] for k in sorted(devices,reverse=True) if 'iOS' in k and any(x['name'].startswith('iPhone') for x in devices[k]))
          small=next((x for x in candidates if 'SE' in x['name'] or x['name'].endswith('e')),candidates[0])
          large=next((x for x in candidates if 'Pro Max' in x['name']),candidates[-1])
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('QA_SMALL='+small['udid']+'\nQA_LARGE='+large['udid']+'\n')
          print('Selected:',small['name'],large['name'])
          PY
      - name: Small phone full audit
        continue-on-error: true
        run: |
          cd ios
          xcodebuild test -project HealthSync.xcodeproj -scheme HealthSync -destination "platform=iOS Simulator,id=$QA_SMALL" -resultBundlePath qa-small.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= > qa-small.log 2>&1
      - name: Large phone dark mode
        continue-on-error: true
        run: |
          cd ios
          xcrun simctl boot "$QA_LARGE" || true
          xcrun simctl bootstatus "$QA_LARGE" -b
          xcrun simctl ui "$QA_LARGE" appearance dark
          xcodebuild test -project HealthSync.xcodeproj -scheme HealthSync -destination "platform=iOS Simulator,id=$QA_LARGE" -only-testing:HealthSyncUITests/AuditUITests -resultBundlePath qa-large-dark.xcresult CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= > qa-large-dark.log 2>&1
      - name: Export evidence
        if: always()
        run: |
          cd ios
          for r in qa-*.xcresult; do
            xcrun xcresulttool export attachments --path "$r" --output-path "${r%.xcresult}-screenshots" || true
            xcrun xcresulttool get test-results summary --path "$r" > "${r%.xcresult}-summary.json" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-simulator-evidence
          path: |
            ios/qa-*.log
            ios/qa-*.json
            ios/qa-*-screenshots
            ios/devices.json
