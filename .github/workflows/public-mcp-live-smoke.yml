name: public-mcp-live-smoke
on:
  push:
    branches: [codex/public-mcp-live-smoke]
    paths: ['scripts/tasks/public-mcp-release-smoke.py', 'firebase/functions/scripts/public-mcp-browser-smoke.mjs', '.github/workflows/public-mcp-live-smoke.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed public OAuth without accessing an account
        run: python3 scripts/tasks/public-mcp-release-smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser verification tools
        working-directory: firebase/functions
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify production consent and real Apple redirect without signing in
        working-directory: firebase/functions
        run: node scripts/public-mcp-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-live-consent
          path: firebase/functions/public-live-screenshots
          if-no-files-found: ignore
