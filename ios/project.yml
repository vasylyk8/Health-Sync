name: HealthSync
options:
  bundleIdPrefix: app.healthsync
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${APPLE_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  HealthSync:
    type: application
    platform: iOS
    sources:
      - path: HealthSync
      - path: ../shared/coverage.json
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - sdk: HealthKit.framework
    entitlements:
      path: HealthSync/HealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin: [Default]
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: HealthSync/Info.plist
      properties:
        CFBundleDisplayName: KROK
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [healthkit]
        NSHealthShareUsageDescription: "KROK reads your workouts from Apple Health, including heart rate, other measurements and GPS routes, plus daily and hourly summaries such as sleep, heart rate, steps and resting heart rate, so the AI assistants you connect (Claude, ChatGPT) can answer questions about your training and recovery. It also reads nutrition, heart alerts, glucose, insulin and blood pressure, symptoms and mood, cycle tracking, medications and profile details if you track them; Apple Health lets you choose each type, and KROK's Settings can switch each group off. Nothing is shared until you connect an assistant."
        NSHealthUpdateUsageDescription: "KROK never writes to Apple Health."
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [app.healthsync.sync, app.healthsync.refresh]
        ITSAppUsesNonExemptEncryption: false
        FirebaseAppDelegateProxyEnabled: false
        PrivacyPolicyURL: ${PUBLIC_BASE_URL}/privacy
        MCPServerURL: https://krok-1d60a.firebaseapp.com/mcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: [-ObjC]
  HealthSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthSyncTests
      - path: ../shared/compact-fixtures.json
        buildPhase: resources
    dependencies:
      - target: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.tests
        GENERATE_INFOPLIST_FILE: YES
  HealthSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HealthSyncUITests]
    dependencies:
      - target: HealthSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HealthSync:
    build:
      targets:
        HealthSync: all
        HealthSyncTests: [test]
        HealthSyncUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HealthSyncTests
        - HealthSyncUITests
    archive:
      config: Release
